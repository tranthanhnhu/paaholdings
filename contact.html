<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — PAA Empire Holdings</title>
  <link rel="canonical" href="https://paa.holdings/contact" />
  <meta property="og:url" content="https://paa.holdings/contact" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header id="site-header"></header>
  <div id="mobile-menu" class="mobile-menu" role="dialog" aria-modal="true"></div>

  <main>
    <section class="hero hero--short hero--mist">
      <div class="hero__bg" style="background-image:url('assets/images/heroes/contact.jpg')"></div>
      <div class="hero__content">
        <p class="hero__label" data-i18n="contact.heroLabel"></p>
        <h1 class="hero__title" data-i18n="contact.heroTitle"></h1>
        <p class="hero__subtitle" data-i18n="contact.heroSubtitle"></p>
      </div>
      <div class="hero__scroll" data-i18n="common.scroll"></div>
    </section>

    <section class="section section--cream">
      <div class="container contact-grid contact-grid--4">
        <div class="contact-block">
          <h3 data-i18n="contact.visitingLabel"></h3>
          <p data-i18n="contact.visitingLines.0"></p>
          <p data-i18n="contact.visitingLines.1"></p>
          <p data-i18n="contact.visitingLines.2"></p>
        </div>
        <div class="contact-block">
          <h3 data-i18n="contact.postalLabel"></h3>
          <p data-i18n="contact.postalLines.0"></p>
          <p data-i18n="contact.postalLines.1"></p>
          <p data-i18n="contact.postalLines.2"></p>
        </div>
        <div class="contact-block">
          <h3 data-i18n="contact.generalLabel"></h3>
          <a href="tel:+85621254180" data-i18n="contact.phone"></a>
          <a href="mailto:contact@paa.holdings" data-i18n="contact.email"></a>
        </div>
        <div class="contact-block">
          <h3 data-i18n="contact.pressLabel"></h3>
          <a href="mailto:contact@paa.holdings">contact@paa.holdings</a>
        </div>
      </div>
      <div class="container map-wrap">
        <h3 class="map-label" data-i18n="contact.locationLabel"></h3>
        <div class="map-embed">
          <iframe
            title="PAA Empire Holdings — Vientiane"
            src="https://maps.google.com/maps?q=Lane+Xang+Avenue,+Vientiane,+Laos&t=&z=14&ie=UTF8&iwloc=&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen
          ></iframe>
        </div>
        <p class="map-caption" data-i18n="contact.locationCaption"></p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
