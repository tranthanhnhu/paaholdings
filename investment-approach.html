<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment approach — PAA Empire Holdings</title>
  <link rel="canonical" href="https://paa.holdings/investment-approach.html" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header id="site-header"></header>
  <div id="mobile-menu" class="mobile-menu" role="dialog" aria-modal="true"></div>

  <main>
    <section class="hero hero--short">
      <div class="hero__bg" style="background-image:url('assets/images/heroes/investment.jpg')"></div>
      <div class="hero__content">
        <p class="hero__label" data-i18n="investment.heroLabel"></p>
        <h1 class="hero__title"><span data-i18n="investment.heroTitle1"></span><span data-i18n="investment.heroTitle2"></span></h1>
      </div>
      <div class="hero__scroll" data-i18n="common.scroll"></div>
    </section>

    <section class="section section--cream">
      <div class="container">
        <span class="section-label" data-i18n="investment.strategyLabel"></span>
        <h2 class="section-title" data-i18n="investment.strategyTitle"></h2>
        <p class="section-lead" data-i18n="investment.strategyIntro"></p>
        <div class="strategy-layout">
          <div class="strategy-list">
            <article class="strategy-item">
              <span class="strategy-item__mark" aria-hidden="true"></span>
              <div class="strategy-item__body">
                <h3 data-i18n="investment.regionalTitle"></h3>
                <p data-i18n="investment.regionalText"></p>
              </div>
            </article>
            <article class="strategy-item">
              <span class="strategy-item__mark" aria-hidden="true"></span>
              <div class="strategy-item__body">
                <h3 data-i18n="investment.realValueTitle"></h3>
                <p data-i18n="investment.realValueText"></p>
              </div>
            </article>
            <article class="strategy-item">
              <span class="strategy-item__mark" aria-hidden="true"></span>
              <div class="strategy-item__body">
                <h3 data-i18n="investment.capabilitiesTitle"></h3>
                <p data-i18n="investment.capabilitiesText"></p>
              </div>
            </article>
          </div>
          <div class="strategy-venn" aria-hidden="true">
            <svg class="venn-diagram" viewBox="0 0 520 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Regional potential, real value and our capabilities">
              <circle class="venn-diagram__ring" cx="260" cy="150" r="132"/>
              <circle class="venn-diagram__ring" cx="168" cy="292" r="132"/>
              <circle class="venn-diagram__ring" cx="352" cy="292" r="132"/>
              <text class="venn-diagram__text venn-diagram__text--top" x="260" y="118" text-anchor="middle">Regional potential</text>
              <text class="venn-diagram__text venn-diagram__text--left" x="118" y="300" text-anchor="middle">Real value</text>
              <text class="venn-diagram__text venn-diagram__text--right" x="402" y="300" text-anchor="middle">Our capabilities</text>
            </svg>
          </div>
        </div>
        <p class="section-note" data-i18n="investment.overlapNote"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <span class="section-label" data-i18n="investment.themesLabel"></span>
        <h2 class="section-title" data-i18n="investment.themesTitle"></h2>
        <div class="themes-grid">
          <article class="theme-card"><img src="assets/images/themes/global-trade.jpg" alt="" loading="lazy" /><div class="theme-card__body"><h3 class="theme-card__title" data-i18n="investment.themes.globalTrade.title"></h3><p class="theme-card__sub" data-i18n="investment.themes.globalTrade.subtitle"></p><p class="theme-card__text" data-i18n="investment.themes.globalTrade.body"></p><p class="theme-card__tag" data-i18n="investment.themes.globalTrade.tagline"></p></div></article>
          <article class="theme-card"><img src="assets/images/themes/circular-economy.jpg" alt="" loading="lazy" /><div class="theme-card__body"><h3 class="theme-card__title" data-i18n="investment.themes.circular.title"></h3><p class="theme-card__sub" data-i18n="investment.themes.circular.subtitle"></p><p class="theme-card__text" data-i18n="investment.themes.circular.body"></p><p class="theme-card__tag" data-i18n="investment.themes.circular.tagline"></p></div></article>
          <article class="theme-card"><img src="assets/images/themes/zero-waste.jpg" alt="" loading="lazy" /><div class="theme-card__body"><h3 class="theme-card__title" data-i18n="investment.themes.zeroWaste.title"></h3><p class="theme-card__sub" data-i18n="investment.themes.zeroWaste.subtitle"></p><p class="theme-card__text" data-i18n="investment.themes.zeroWaste.body"></p><p class="theme-card__tag" data-i18n="investment.themes.zeroWaste.tagline"></p></div></article>
          <article class="theme-card"><img src="assets/images/themes/shared-value.jpg" alt="" loading="lazy" /><div class="theme-card__body"><h3 class="theme-card__title" data-i18n="investment.themes.sharedValue.title"></h3><p class="theme-card__sub" data-i18n="investment.themes.sharedValue.subtitle"></p><p class="theme-card__text" data-i18n="investment.themes.sharedValue.body"></p><p class="theme-card__tag" data-i18n="investment.themes.sharedValue.tagline"></p></div></article>
          <article class="theme-card"><img src="assets/images/themes/value-added.jpg" alt="" loading="lazy" /><div class="theme-card__body"><h3 class="theme-card__title" data-i18n="investment.themes.valueAdded.title"></h3><p class="theme-card__sub" data-i18n="investment.themes.valueAdded.subtitle"></p><p class="theme-card__text" data-i18n="investment.themes.valueAdded.body"></p><p class="theme-card__tag" data-i18n="investment.themes.valueAdded.tagline"></p></div></article>
        </div>
        <p class="section-note" style="margin-top:2rem" data-i18n="investment.themesClosing"></p>
      </div>
    </section>

    <section class="section section--cream">
      <div class="container">
        <span class="section-label" data-i18n="investment.ownershipLabel"></span>
        <h2 class="section-title" data-i18n="investment.ownershipTitle"></h2>
        <p class="section-lead" data-i18n="investment.ownershipIntro"></p>
        <div class="ownership-grid">
          <article class="ownership-card"><h3 data-i18n="investment.buildGuide.title"></h3><p data-i18n="investment.buildGuide.text"></p></article>
          <article class="ownership-card"><h3 data-i18n="investment.seekDevelop.title"></h3><p data-i18n="investment.seekDevelop.text"></p></article>
          <article class="ownership-card"><h3 data-i18n="investment.facilitate.title"></h3><p data-i18n="investment.facilitate.text"></p></article>
        </div>
        <p class="section-note" data-i18n="investment.ownershipClosing"></p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
