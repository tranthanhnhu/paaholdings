<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAA Empire Holdings</title>
  <meta name="description" content="PAA Empire Holdings — diversified investment company in Southeast Asia." />
  <link rel="canonical" href="https://paa.holdings/" />
  <meta property="og:url" content="https://paa.holdings/" />
  <meta property="og:site_name" content="PAA Empire Holdings" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header id="site-header"></header>
  <div id="mobile-menu" class="mobile-menu" role="dialog" aria-modal="true"></div>

  <main>
    <section class="hero">
      <div class="hero__bg" style="background-image:url('assets/images/heroes/home.jpg')"></div>
      <div class="hero__content">
        <p class="hero__label" data-i18n="home.heroLabel"></p>
        <h1 class="hero__title">
          <span data-i18n="home.heroLine1"></span>
          <span data-i18n="home.heroLine2"></span>
          <span data-i18n="home.heroLine3"></span>
        </h1>
      </div>
      <div class="hero__scroll" data-i18n="common.scroll"></div>
    </section>

    <section class="section section--cream">
      <div class="container">
        <span class="section-label" data-i18n="home.aboutLabel"></span>
        <h2 class="section-title" data-i18n="home.aboutTitle"></h2>
        <div class="prose">
          <p data-i18n="home.aboutP1"></p>
          <p data-i18n="home.aboutP2"></p>
          <p data-i18n="home.aboutP3"></p>
          <p data-i18n="home.aboutP4"></p>
        </div>
        <p class="section-note" data-i18n="home.aboutHq"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <span class="section-label" data-i18n="home.businessesLabel"></span>
        <h2 class="section-title" data-i18n="home.businessesTitle"></h2>
        <div class="sector-grid">
          <article class="sector-card"><img src="assets/images/sectors/agriculture.jpg" alt="" loading="lazy" /><span class="sector-card__label" data-i18n="home.sectors.agriculture"></span></article>
          <article class="sector-card"><img src="assets/images/sectors/food.jpg" alt="" loading="lazy" /><span class="sector-card__label" data-i18n="home.sectors.food"></span></article>
          <article class="sector-card"><img src="assets/images/sectors/materials.jpg" alt="" loading="lazy" /><span class="sector-card__label" data-i18n="home.sectors.materials"></span></article>
          <article class="sector-card"><img src="assets/images/sectors/trading.jpg" alt="" loading="lazy" /><span class="sector-card__label" data-i18n="home.sectors.trading"></span></article>
          <article class="sector-card"><img src="assets/images/sectors/real-estate.jpg" alt="" loading="lazy" /><span class="sector-card__label" data-i18n="home.sectors.realEstate"></span></article>
        </div>
      </div>
    </section>

    <section class="section section--cream learn-section">
      <div class="container">
        <h2 class="section-title" data-i18n="home.learnTitle"></h2>
        <div class="learn-grid">
          <article class="learn-card"><a href="who-we-are.html"><h3 data-i18n="home.linkWhoTitle"></h3><p data-i18n="home.linkWhoText"></p></a></article>
          <article class="learn-card"><a href="investment-approach.html"><h3 data-i18n="home.linkInvestTitle"></h3><p data-i18n="home.linkInvestText"></p></a></article>
          <article class="learn-card"><a href="our-business.html"><h3 data-i18n="home.linkBizTitle"></h3><p data-i18n="home.linkBizText"></p></a></article>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
