<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our business — PAA Empire Holdings</title>
  <link rel="canonical" href="https://paa.holdings/our-business" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header id="site-header"></header>
  <div id="mobile-menu" class="mobile-menu" role="dialog" aria-modal="true"></div>

  <main>
    <section class="hero hero--short">
      <div class="hero__bg" style="background-image:url('assets/images/heroes/business.jpg')"></div>
      <div class="hero__content">
        <p class="hero__label" data-i18n="business.heroLabel"></p>
        <h1 class="hero__title" data-i18n="business.heroTitle"></h1>
      </div>
      <div class="hero__scroll" data-i18n="common.scroll"></div>
    </section>

    <section class="section section--cream">
      <div class="container">
        <span class="section-label" data-i18n="business.howLabel"></span>
        <h2 class="section-title" data-i18n="business.howTitle"></h2>
        <p class="section-lead" data-i18n="business.howIntro"></p>
        <div class="paths-grid">
          <article class="path-card">
            <p class="path-card__title" data-i18n="business.paths.build.title"></p>
            <p class="path-card__sub" data-i18n="business.paths.build.subtitle"></p>
            <p class="path-card__text" data-i18n="business.paths.build.text"></p>
          </article>
          <article class="path-card">
            <p class="path-card__title" data-i18n="business.paths.acquire.title"></p>
            <p class="path-card__sub" data-i18n="business.paths.acquire.subtitle"></p>
            <p class="path-card__text" data-i18n="business.paths.acquire.text"></p>
          </article>
          <article class="path-card">
            <p class="path-card__title" data-i18n="business.paths.partner.title"></p>
            <p class="path-card__sub" data-i18n="business.paths.partner.subtitle"></p>
            <p class="path-card__text" data-i18n="business.paths.partner.text"></p>
          </article>
          <article class="path-card">
            <p class="path-card__title" data-i18n="business.paths.invest.title"></p>
            <p class="path-card__sub" data-i18n="business.paths.invest.subtitle"></p>
            <p class="path-card__text" data-i18n="business.paths.invest.text"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <span class="section-label" data-i18n="business.groupLabel"></span>
        <h2 class="section-title" data-i18n="business.groupTitle"></h2>
        <div class="filter-bar" role="tablist">
          <button class="filter-btn is-active" data-filter="all" data-i18n="business.filterAll"></button>
          <button class="filter-btn" data-filter="build" data-i18n="business.filterBuild"></button>
          <button class="filter-btn" data-filter="acquire" data-i18n="business.filterAcquire"></button>
          <button class="filter-btn" data-filter="partner" data-i18n="business.filterPartner"></button>
          <button class="filter-btn" data-filter="invest" data-i18n="business.filterInvest"></button>
        </div>
        <div class="portfolio-grid">
          <a class="portfolio-card" href="paa-agro" data-path="build">
            <img src="assets/images/portfolio/paa-agro.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.paaAgro.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.paaAgro.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.paaAgro.meta"></p>
              <p class="portfolio-card__more" data-i18n="common.learnMore"></p>
            </div>
          </a>
          <article class="portfolio-card" data-path="acquire">
            <img src="assets/images/portfolio/mekong-latex.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.mekongLatex.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.mekongLatex.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.mekongLatex.meta"></p>
              <p class="portfolio-card__summary" data-i18n="business.companies.mekongLatex.summary"></p>
            </div>
          </article>
          <article class="portfolio-card" data-path="build">
            <img src="assets/images/portfolio/savannakhet-foods.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.savannakhetFoods.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.savannakhetFoods.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.savannakhetFoods.meta"></p>
              <p class="portfolio-card__summary" data-i18n="business.companies.savannakhetFoods.summary"></p>
            </div>
          </article>
          <article class="portfolio-card" data-path="partner">
            <img src="assets/images/portfolio/lan-xang-trading.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.lanXangTrading.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.lanXangTrading.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.lanXangTrading.meta"></p>
              <p class="portfolio-card__summary" data-i18n="business.companies.lanXangTrading.summary"></p>
            </div>
          </article>
          <article class="portfolio-card" data-path="invest">
            <img src="assets/images/portfolio/that-luang-estates.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.thatLuangEstates.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.thatLuangEstates.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.thatLuangEstates.meta"></p>
              <p class="portfolio-card__summary" data-i18n="business.companies.thatLuangEstates.summary"></p>
            </div>
          </article>
          <article class="portfolio-card" data-path="acquire">
            <img src="assets/images/portfolio/bolaven-cassava.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.bolavenCassava.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.bolavenCassava.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.bolavenCassava.meta"></p>
              <p class="portfolio-card__summary" data-i18n="business.companies.bolavenCassava.summary"></p>
            </div>
          </article>
          <article class="portfolio-card" data-path="partner">
            <img src="assets/images/portfolio/indochina-pack.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.indochinaPack.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.indochinaPack.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.indochinaPack.meta"></p>
              <p class="portfolio-card__summary" data-i18n="business.companies.indochinaPack.summary"></p>
            </div>
          </article>
          <article class="portfolio-card" data-path="invest">
            <img src="assets/images/portfolio/annam-timber.jpg" alt="" loading="lazy" />
            <div class="portfolio-card__body">
              <p class="portfolio-card__path" data-i18n="business.companies.annamTimber.path"></p>
              <h3 class="portfolio-card__name" data-i18n="business.companies.annamTimber.name"></h3>
              <p class="portfolio-card__meta" data-i18n="business.companies.annamTimber.meta"></p>
              <p class="portfolio-card__summary" data-i18n="business.companies.annamTimber.summary"></p>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
