<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAA Agro — PAA Empire Holdings</title>
  <link rel="canonical" href="https://paa.holdings/paa-agro.html" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header id="site-header"></header>
  <div id="mobile-menu" class="mobile-menu" role="dialog" aria-modal="true"></div>

  <main>
    <section class="hero hero--short">
      <div class="hero__bg" style="background-image:url('assets/images/heroes/paa-agro.jpg')"></div>
      <div class="hero__content">
        <p class="hero__label" data-i18n="paaAgro.path"></p>
        <h1 class="hero__title" data-i18n="paaAgro.title"></h1>
        <p class="hero__subtitle" data-i18n="paaAgro.tagline"></p>
      </div>
      <div class="hero__scroll" data-i18n="common.scroll"></div>
    </section>

    <section class="section section--cream">
      <div class="container company-layout">
        <div class="company-body">
          <p class="company-path" data-i18n="paaAgro.path"></p>
          <h2 class="company-title" data-i18n="paaAgro.title"></h2>
          <p class="company-tagline" data-i18n="paaAgro.tagline"></p>
          <p data-i18n="paaAgro.p1"></p>
          <p data-i18n="paaAgro.p2"></p>
          <a class="company-cta" href="#" data-i18n="paaAgro.cta"></a>
        </div>
        <aside class="facts-panel">
          <h3 data-i18n="common.headquarters"></h3>
          <dl>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.path.label"></dt><dd data-i18n="paaAgro.facts.path.value"></dd></div>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.established.label"></dt><dd data-i18n="paaAgro.facts.established.value"></dd></div>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.ownership.label"></dt><dd data-i18n="paaAgro.facts.ownership.value"></dd></div>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.sector.label"></dt><dd data-i18n="paaAgro.facts.sector.value"></dd></div>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.hq.label"></dt><dd data-i18n="paaAgro.facts.hq.value"></dd></div>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.land.label"></dt><dd data-i18n="paaAgro.facts.land.value"></dd></div>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.people.label"></dt><dd data-i18n="paaAgro.facts.people.value"></dd></div>
            <div class="fact-row"><dt data-i18n="paaAgro.facts.md.label"></dt><dd data-i18n="paaAgro.facts.md.value"></dd></div>
          </dl>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
