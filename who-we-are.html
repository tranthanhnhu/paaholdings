<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who we are — PAA Empire Holdings</title>
  <link rel="canonical" href="https://paa.holdings/who-we-are.html" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header id="site-header"></header>
  <div id="mobile-menu" class="mobile-menu" role="dialog" aria-modal="true"></div>

  <main>
    <section class="hero hero--short hero--mist">
      <div class="hero__bg" style="background-image:url('assets/images/heroes/about.jpg')"></div>
      <div class="hero__content">
        <p class="hero__label" data-i18n="about.heroLabel"></p>
        <h1 class="hero__title" data-i18n="about.heroTitle"></h1>
      </div>
      <div class="hero__scroll" data-i18n="common.scroll"></div>
    </section>

    <section class="section section--cream">
      <div class="container">
        <h2 class="section-title" data-i18n="about.introTitle"></h2>
        <div class="prose"><p data-i18n="about.introP1"></p></div>
        <ul class="sector-icons">
          <li data-i18n="about.sectorAgriculture"></li>
          <li data-i18n="about.sectorFood"></li>
          <li data-i18n="about.sectorMaterials"></li>
          <li data-i18n="about.sectorTrading"></li>
          <li data-i18n="about.sectorRealEstate"></li>
        </ul>
        <div class="prose"><p data-i18n="about.introP2"></p></div>
        <p class="section-note" data-i18n="about.introHq"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <span class="section-label" data-i18n="about.valuesLabel"></span>
        <h2 class="section-title" data-i18n="about.valuesTitle"></h2>
        <p class="section-lead" data-i18n="about.valuesIntro"></p>
        <div class="values-grid">
          <article class="value-card">
            <div class="value-card__head">
              <div class="value-card__icon"><img src="assets/images/values/adapt.svg" alt="" /></div>
              <p class="value-card__index">// 001</p>
            </div>
            <h3 class="value-card__title" data-i18n="about.values.adapt.title"></h3>
            <p class="value-card__text" data-i18n="about.values.adapt.text"></p>
            <span class="value-card__badge" data-i18n="about.values.adapt.badge"></span>
          </article>
          <article class="value-card">
            <div class="value-card__head">
              <div class="value-card__icon"><img src="assets/images/values/build.svg" alt="" /></div>
              <p class="value-card__index">// 002</p>
            </div>
            <h3 class="value-card__title" data-i18n="about.values.build.title"></h3>
            <p class="value-card__text" data-i18n="about.values.build.text"></p>
            <span class="value-card__badge" data-i18n="about.values.build.badge"></span>
          </article>
          <article class="value-card">
            <div class="value-card__head">
              <div class="value-card__icon"><img src="assets/images/values/honor.svg" alt="" /></div>
              <p class="value-card__index">// 003</p>
            </div>
            <h3 class="value-card__title" data-i18n="about.values.honor.title"></h3>
            <p class="value-card__text" data-i18n="about.values.honor.text"></p>
            <span class="value-card__badge" data-i18n="about.values.honor.badge"></span>
          </article>
          <article class="value-card">
            <div class="value-card__head">
              <div class="value-card__icon"><img src="assets/images/values/sustain.svg" alt="" /></div>
              <p class="value-card__index">// 004</p>
            </div>
            <h3 class="value-card__title" data-i18n="about.values.sustain.title"></h3>
            <p class="value-card__text" data-i18n="about.values.sustain.text"></p>
            <span class="value-card__badge" data-i18n="about.values.sustain.badge"></span>
          </article>
          <article class="value-card">
            <div class="value-card__head">
              <div class="value-card__icon"><img src="assets/images/values/share.svg" alt="" /></div>
              <p class="value-card__index">// 005</p>
            </div>
            <h3 class="value-card__title" data-i18n="about.values.share.title"></h3>
            <p class="value-card__text" data-i18n="about.values.share.text"></p>
            <span class="value-card__badge" data-i18n="about.values.share.badge"></span>
          </article>
        </div>
      </div>
    </section>

    <section class="section section--cream">
      <div class="container journey">
        <div class="journey__media journey__media--portrait"><img src="assets/images/journey/rubber.jpg" alt="" loading="lazy" /></div>
        <div class="journey__body">
          <span class="section-label section-label--left" data-i18n="about.journeyLabel"></span>
          <h2 class="section-title section-title--left" data-i18n="about.journeyTitle"></h2>
          <p data-i18n="about.journeyP1"></p>
          <p data-i18n="about.journeyP2"></p>
          <p data-i18n="about.journeyP3"></p>
        </div>
      </div>
      <div class="container milestones">
        <p class="milestones__intro" data-i18n="about.milestonesIntro"></p>
        <div class="milestone"><span class="milestone__num">01</span><p class="milestone__title" data-i18n="about.m1"></p><span class="milestone__toggle">+</span></div>
        <div class="milestone"><span class="milestone__num">02</span><p class="milestone__title" data-i18n="about.m2"></p><span class="milestone__toggle">+</span></div>
        <div class="milestone"><span class="milestone__num">03</span><p class="milestone__title" data-i18n="about.m3"></p><span class="milestone__toggle">+</span></div>
        <div class="milestone"><span class="milestone__num">04</span><p class="milestone__title" data-i18n="about.m4"></p><span class="milestone__toggle">+</span></div>
      </div>
    </section>

    <section class="section">
      <div class="container text-center">
        <span class="section-label" data-i18n="about.firstGenLabel"></span>
        <h2 class="section-title" data-i18n="about.firstGenTitle"></h2>
        <div class="prose">
          <p data-i18n="about.firstGenP1"></p>
          <p data-i18n="about.firstGenP2"></p>
          <p data-i18n="about.firstGenP3"></p>
        </div>
        <p class="principles-row" data-i18n="about.principles"></p>
      </div>
    </section>

    <section class="foundation-block">
      <img class="foundation-block__photo" src="assets/images/journey/community.jpg" alt="" loading="lazy" />
      <div class="foundation-block__body section section--navy">
        <div class="container text-center">
          <h2 class="section-title" data-i18n="about.foundationTitle"></h2>
          <div class="prose prose--light">
            <p data-i18n="about.foundationP1"></p>
            <p data-i18n="about.foundationP2"></p>
            <p data-i18n="about.foundationP3"></p>
            <p data-i18n="about.foundationP4"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
